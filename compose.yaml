name: task-manager

x-app-env: &app-env
  APP_NAME: task-manager
  APP_ENV: ${APP_ENV:-development}
  HTTP_ADDR: :8080
  SERVER_BASE_URL: ${SERVER_BASE_URL:-http://server:8080}
  DATABASE_URL: ${DATABASE_URL:-postgres://task_manager:task_manager@postgres:5432/task_manager?sslmode=disable}
  S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-task-manager-dev}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-task-manager-dev-secret}
  S3_BUCKET: ${S3_BUCKET:-task-manager-dev}
  S3_USE_SSL: ${S3_USE_SSL:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-task-manager-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-task-manager-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      target: runtime
    environment: *app-env
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["tools", "test"]
    build:
      context: .
      target: runtime
    entrypoint: ["/app/migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  smoke:
    profiles: ["test"]
    build:
      context: .
      target: runtime
    entrypoint: ["/app/smoke"]
    environment: *app-env
    depends_on:
      server:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: task_manager_postgres_data
  minio_data:
    name: task_manager_minio_data
